<title>Faiza Queen Academy</title>
<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top{max-width:1050px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font:700 1.5rem Georgia,"Times New Roman",serif;color:#fff;text-decoration:none;letter-spacing:.3px}
.logo i{color:var(--teal);font-style:normal}
#q{flex:1 1 260px;max-width:460px;padding:10px 14px;border-radius:24px;border:2px solid var(--teal);font-size:1rem;background:#fff;color:#0b2545}
nav{max-width:1050px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav a{color:#cfe9ee;text-decoration:none;font-size:.85rem;padding:4px 10px;border-radius:14px;white-space:nowrap}
nav a:hover,nav a.on{background:var(--teal);color:#fff}
main{max-width:1050px;margin:auto;padding:18px 14px 50px}
.hero{background:linear-gradient(135deg,var(--navy),#0f4c5c);color:#fff;border-radius:16px;padding:28px 22px;margin-bottom:22px}
.hero h1{margin:0 0 6px;font:700 clamp(1.6rem,5vw,2.4rem) Georgia,serif}
.hero p{margin:4px 0;max-width:640px;color:#d6edf0}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:1rem;cursor:pointer;text-decoration:none;margin:6px 6px 0 0}
.btn.alt{background:transparent;border:2px solid var(--teal);color:var(--teal)}
.btn:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--teal);border-radius:10px;padding:14px;text-decoration:none;color:var(--tx);display:block}
.card:hover{border-color:var(--teal);box-shadow:0 3px 12px rgba(19,168,158,.25)}
.card b{display:block;color:var(--navy);font-size:1.05rem}
@media(prefers-color-scheme:dark){.card b{color:#7fe3da}}
.card span{color:var(--mu);font-size:.9rem}
h2{color:var(--navy);margin:22px 0 8px}h3{margin:8px 0}
@media(prefers-color-scheme:dark){h2{color:#7fe3da}}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:8px 0;padding:8px 14px}
summary{cursor:pointer;font-weight:600;color:var(--navy)}
@media(prefers-color-scheme:dark){summary{color:#7fe3da}}
.note{background:var(--teal2);border-radius:8px;padding:10px 14px;font-size:.92rem;margin:12px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;background:var(--card)}
th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;font-size:.9rem;vertical-align:top}th{background:var(--navy);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 14px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:1rem;cursor:pointer}
.opt:hover{border-color:var(--teal)}.opt.ok{background:#d9f5e3;border-color:#1b9e4b;color:#0b3d1c}.opt.no{background:#fde0e0;border-color:#d33;color:#5a0d0d}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:8px 0}.bar div{height:100%;background:var(--teal);border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:20px 14px}
</style></head><body>
